[package]
name = "scropper_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde_json = "1"
# No `single-thread` feature: the engine is shared across WebView IO threads.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
